# First real entity definition file wired into the product (docs/adr/0010). Block style only --
# this project's mini-yaml checkout doesn't parse flow-style maps/sequences (see
# entity_file_parser_yaml.cpp's header comment, docs/adr/0008's Implementation status note).
components:
  Position:
    x: 0
    y: 0
    z: 0
  # ADR-0019's Plan item 4: a real Renderable, replacing the DrawCubeWires hardcoded in
  # game/sandbox/human_view.cpp's GameplayScene before this. wireframe: false (unlike its old
  # MAROON *wireframe* look) so this actually draws through HumanView's lit RenderMaterial/rim-glow
  # path (renderable.h's wireframe branch skips materials entirely) -- proving the same technique
  # game/flare_reactor's reactor uses works for an independently-built consumer.
  Renderable:
    shape: box
    color: maroon
    wireframe: false
