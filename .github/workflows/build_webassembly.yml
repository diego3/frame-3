name: Build Project - WebAssembly

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/build_webassembly.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write       # Required for actions/upload-release-asset to upload release asset
    runs-on: windows-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}
      PROJECT_BUILD_PATH: ${{ github.event.repository.name }}\\build\\release
      PROJECT_RELEASE_PATH: ${{ github.event.repository.name }}_dev_wasm
      BUILD_WEB_SHELL: platform/minshell.html
      # No release tags exist upstream for mini-yaml (docs/adr/0008), same reason ci_sanity.yml
      # pins a commit SHA instead of a tag.
      MINI_YAML_COMMIT: 22d3dcf5684a11f9c0508c1ad8b3282a1d888319

    steps:
    - name: Checkout this repo
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}

    - name: Checkout raylib repo
      uses: actions/checkout@master
      with:
        repository: raysan5/raylib
        ref: "6.0"
        path: raylib

    - name: Checkout EnTT repo
      uses: actions/checkout@master
      with:
        repository: skypjack/entt
        ref: v4.0.0
        path: entt

    # mini-yaml (docs/adr/0008) backs entity_file_parser_yaml.cpp, part of the main product build
    # since docs/adr/0011 (Engine::Init() calls LoadOrCreateEngineConfig()) -- without this, "Build
    # Product" below fails with "yaml/Yaml.hpp: No such file or directory" against the Makefile's
    # own MINI_YAML_PATH default (a Windows-only placeholder path, not a real checkout).
    - name: Checkout mini-yaml repo
      uses: actions/checkout@master
      with:
        repository: jimmiebergmann/mini-yaml
        ref: ${{ env.MINI_YAML_COMMIT }}
        path: mini-yaml

    - name: Setup emsdk
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 5.0.3
        actions-cache-folder: 'emsdk-cache'

    - name: Setup Release Paths
      run: |
        echo "PROJECT_VERSION=${{ github.event.release.tag_name }}_wasm" >> $GITHUB_ENV
        echo "PROJECT_RELEASE_PATH=${{ env.PROJECT_NAME }}_v${{ github.event.release.tag_name }}_wasm" >> $GITHUB_ENV
      shell: bash
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Setup Environment
      run: |
        mkdir ${{ env.PROJECT_RELEASE_PATH }}
        dir

    - name: Build raylib Library
      run: |
        cd raylib/src
        emcc -v
        make PLATFORM=PLATFORM_WEB RAYLIB_BUILD_MODE=RELEASE RAYLIB_LIBTYPE=STATIC EMSDK_PATH="D:/a/${{ env.PROJECT_REPO_NAME }}/${{ env.PROJECT_REPO_NAME }}/emsdk-cache/emsdk-main" RAYLIB_RELEASE_PATH=. -B

    - name: Build Product
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}/src
        make PLATFORM=PLATFORM_WEB BUILD_MODE=RELEASE EMSDK_PATH="D:/a/${{ env.PROJECT_REPO_NAME }}/${{ env.PROJECT_REPO_NAME }}/emsdk-cache/emsdk-main" PROJECT_BUILD_PATH=../build/release RAYLIB_PATH=../../raylib ENTT_PATH=../../entt MINI_YAML_PATH=../../mini-yaml -B

    - name: Generate Artifacts
      run: |
        dir ${{ env.PROJECT_BUILD_PATH }}
        copy /Y ${{ env.PROJECT_BUILD_PATH }}\${{ env.PROJECT_NAME }}.wasm ${{ env.PROJECT_RELEASE_PATH }}\${{ env.PROJECT_NAME }}.wasm
        copy /Y ${{ env.PROJECT_BUILD_PATH }}\${{ env.PROJECT_NAME }}.data ${{ env.PROJECT_RELEASE_PATH }}\${{ env.PROJECT_NAME }}.data
        copy /Y ${{ env.PROJECT_BUILD_PATH }}\${{ env.PROJECT_NAME }}.js ${{ env.PROJECT_RELEASE_PATH }}\${{ env.PROJECT_NAME }}.js
        copy /Y ${{ env.PROJECT_BUILD_PATH }}\${{ env.PROJECT_NAME }}.html ${{ env.PROJECT_RELEASE_PATH }}\index.html
        copy /Y ${{ env.PROJECT_REPO_NAME }}\README.md ${{ env.PROJECT_RELEASE_PATH }}\README.md
        copy /Y ${{ env.PROJECT_REPO_NAME }}\LICENSE ${{ env.PROJECT_RELEASE_PATH }}\LICENSE
        dir ${{ env.PROJECT_RELEASE_PATH }}
        7z a .\${{ env.PROJECT_RELEASE_PATH }}.zip .\${{ env.PROJECT_RELEASE_PATH }}\*
      shell: cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.PROJECT_RELEASE_PATH }}.zip
        path: |
            ./${{ env.PROJECT_RELEASE_PATH }}
            !./${{ env.PROJECT_RELEASE_PATH }}.zip

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ env.PROJECT_RELEASE_PATH }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'release' && github.event.action == 'published'
