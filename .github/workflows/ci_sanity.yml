name: CI - Build Sanity Check

# Fast fail-fast signal: does the project still compile cleanly? Unlike the build_*.yml
# release workflows (which build on 4 platforms, package artifacts, and only run on push/release),
# this is a single Linux job with caching, meant to answer that question in a couple of minutes
# on every push and pull request.

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/ci_sanity.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/ci_sanity.yml'

permissions:
  contents: read

concurrency:
  group: ci-sanity-${{ github.ref }}
  cancel-in-progress: true

env:
  # Quoted: unquoted 6.0 is parsed as YAML float 6 and loses the trailing .0, breaking the
  # raylib tag checkout below.
  RAYLIB_VERSION: "6.0"
  ENTT_VERSION: v4.0.0
  DOCTEST_VERSION: v2.5.3
  # No release tags exist upstream for mini-yaml (docs/adr/0008) -- see test.sh's comment -- so
  # this pins a commit SHA instead of a tag, same as test.sh does for local/dev builds.
  MINI_YAML_COMMIT: 22d3dcf5684a11f9c0508c1ad8b3282a1d888319

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache raylib (source + built static lib)
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: raylib
          key: raylib-${{ env.RAYLIB_VERSION }}-${{ runner.os }}-v1

      - name: Checkout raylib repo
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          ref: ${{ env.RAYLIB_VERSION }}
          path: raylib

      - name: Cache EnTT (header-only)
        id: cache-entt
        uses: actions/cache@v4
        with:
          path: entt
          key: entt-${{ env.ENTT_VERSION }}-v1

      - name: Checkout EnTT repo
        if: steps.cache-entt.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: skypjack/entt
          ref: ${{ env.ENTT_VERSION }}
          path: entt

      - name: Cache doctest (header-only)
        id: cache-doctest
        uses: actions/cache@v4
        with:
          path: doctest
          key: doctest-${{ env.DOCTEST_VERSION }}-v1

      - name: Checkout doctest repo
        if: steps.cache-doctest.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: doctest/doctest
          ref: ${{ env.DOCTEST_VERSION }}
          path: doctest

      - name: Cache mini-yaml
        id: cache-mini-yaml
        uses: actions/cache@v4
        with:
          path: mini-yaml
          key: mini-yaml-${{ env.MINI_YAML_COMMIT }}-v1

      - name: Checkout mini-yaml repo
        if: steps.cache-mini-yaml.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: jimmiebergmann/mini-yaml
          ref: ${{ env.MINI_YAML_COMMIT }}
          path: mini-yaml

      - name: Install raylib system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev

      - name: Build raylib library
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: make -C raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC

      - name: Build project (warnings treated as errors)
        # -Wno-error=catch-value: mini-yaml's own Yaml.cpp (docs/adr/0008) is now part of the main
        # product build too (Engine::Init() calls LoadOrCreateEngineConfig(), docs/adr/0011, which
        # reuses ADR-0008's YAML parser) -- warnings in vendored code aren't this project's to fix.
        run: make -C src PLATFORM=PLATFORM_DESKTOP RAYLIB_PATH=../raylib ENTT_PATH=../entt MINI_YAML_PATH=../mini-yaml PROJECT_CUSTOM_FLAGS="-Werror -Wno-error=catch-value"

      - name: Build and run unit tests (see docs/adr/0006-doctest-for-unit-tests.md)
        # Most tests under test (EventManager, ProcessManager, ResourceCache) are pure logic and
        # need no raylib/EnTT dependency; hierarchy_test.cpp (docs/adr/0002), entity_factory_test.cpp
        # (docs/adr/0008), and level_loader_test.cpp (docs/adr/0009) are the exceptions needing
        # entt::registry and raylib's header-only raymath.h -- reusing the same raylib/entt
        # checkouts the build step above already has, not linking against libraylib.a either way.
        # entity_file_parser_yaml_test.cpp/level_loader_test.cpp/engine_config_test.cpp
        # additionally need mini-yaml, which -Werror also treats as strictly as this project's own
        # code -- excluded via -Wno-error, since warnings in vendored code aren't this project's to
        # fix (see PROJECT_CUSTOM_FLAGS applying to every %.cpp compiled here, including
        # tests/mini_yaml.o's copy of mini-yaml's own Yaml.cpp). engine_config_test.cpp/
        # file_io_test.cpp/game_config_test.cpp do real file I/O against a gitignored scratch dir.
        run: |
          make -C src tests DOCTEST_PATH=../doctest RAYLIB_PATH=../raylib ENTT_PATH=../entt MINI_YAML_PATH=../mini-yaml PROJECT_CUSTOM_FLAGS="-Werror -Wno-error=catch-value"
          src/tests_runner
